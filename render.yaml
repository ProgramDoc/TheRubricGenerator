services:
  - type: web
    name: therubricgenerator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: RENDER_DATA_DIR
        value: /var/data
      - key: OBSIDIAN_VAULT_DIR
        value: /var/data/obsidian_vault
      - key: ADMIN_EMAIL
        value: tck936@mail.harvard.edu
      - key: ADMIN_NAME
        value: Admin
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      - key: DAILY_ENABLED
        value: "true"
      - key: DAILY_MAX_PAPERS
        value: "10"
      # Set these as secret values in the Render dashboard:
      # ADMIN_SECRET
      # ANTHROPIC_API_KEY
      # OPENAI_API_KEY
      # GEMINI_API_KEY
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
      # APP_BASE_URL
      # NCBI_API_KEY (optional — boosts PubMed rate limit from 3/s to 10/s)
    disk:
      name: rubricgen-data
      mountPath: /var/data
      sizeGB: 1
