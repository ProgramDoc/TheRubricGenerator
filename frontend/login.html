<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Researcher — Sign In</title>
<link rel="stylesheet" href="/static/_shared/design.css">
<style>
  /* Centered sign-in card on a warm Paper ground. All tokens come from
     /static/_shared/design.css (Paper/Graphite/Midnight themes + Geist +
     Source Serif 4 + JetBrains Mono). */
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 16px;
    background:
      radial-gradient(900px 500px at 50% -10%, oklch(0.96 0.02 85 / .9), transparent 60%),
      var(--paper-2);
  }

  /* Brand heading */
  .brand-header { text-align: center; margin-bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand-header .mark {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 700; font-size: 26px;
    font-style: italic; letter-spacing: -.02em;
  }
  .brand-header .title {
    font-family: var(--serif); font-size: 20px; font-weight: 600;
    color: var(--ink); letter-spacing: -.02em;
  }
  .brand-header .kicker {
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-3); text-transform: uppercase; letter-spacing: .14em;
  }

  /* Card */
  .card {
    width: 400px; max-width: 100%;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    overflow: hidden;
  }

  /* Tabs */
  .tabs {
    display: flex; border-bottom: 1px solid var(--rule);
    background: var(--paper-2);
  }
  .tab {
    flex: 1; padding: 13px 14px;
    text-align: center;
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color var(--t), background var(--t);
    user-select: none;
  }
  .tab.active {
    color: var(--ink); background: var(--paper);
    border-bottom-color: var(--ink);
  }
  .tab:hover:not(.active) { color: var(--ink); background: var(--paper-3); }

  /* Form */
  .form-body { padding: 26px 26px 20px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .12em;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%; padding: 9px 11px;
    font-family: var(--sans); font-size: 13px;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: var(--radius-sm);
    outline: none;
    transition: border-color var(--t), box-shadow var(--t);
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px oklch(from var(--accent) l c h / .18);
  }
  .field input.error { border-color: var(--err); }
  .field-hint {
    font-size: 11px; color: var(--ink-4); margin-top: 4px;
  }

  .forgot-link {
    display: block; text-align: right; font-size: 11.5px;
    color: var(--accent); text-decoration: none; margin-top: 6px;
    cursor: pointer; font-weight: 500;
  }
  .forgot-link:hover { text-decoration: underline; }

  /* Forgot panel */
  .forgot-panel {
    display: none; margin-top: 12px; padding: 14px;
    background: var(--accent-soft); border: 1px solid var(--accent-soft);
    border-radius: var(--radius-sm);
  }
  .forgot-panel.open { display: block; }
  .forgot-panel label { color: var(--accent-ink) !important; }
  .forgot-submit {
    width: 100%; padding: 8px;
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: #fff; background: var(--accent); border: 0;
    border-radius: var(--radius-sm); cursor: pointer; margin-top: 10px;
    transition: background var(--t);
  }
  .forgot-submit:hover { background: oklch(from var(--accent) calc(l - .05) c h); }

  /* Banners */
  .banner {
    padding: 10px 12px; border-radius: var(--radius-sm);
    font-size: 12px; line-height: 1.45;
    margin-bottom: 14px; display: none;
    font-family: var(--sans);
  }
  .banner.error   { background: var(--err-soft);  color: var(--err);  display: block; }
  .banner.success { background: var(--ok-soft);   color: var(--ok);   display: block; }

  /* Submit */
  .submit-btn {
    width: 100%; padding: 10px;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    color: var(--paper); background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: var(--radius-sm); cursor: pointer; margin-top: 2px;
    transition: background var(--t);
  }
  .submit-btn:hover:not(:disabled) { background: oklch(from var(--ink) calc(l - .04) c h); }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0;
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--ink-4);
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--rule);
  }

  /* Admin shortcut */
  .admin-btn {
    width: 100%; padding: 9px;
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: var(--ink-3); background: transparent;
    border: 1px solid var(--rule); border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background var(--t), border-color var(--t), color var(--t);
  }
  .admin-btn:hover {
    background: var(--paper-2); border-color: var(--rule-2); color: var(--ink);
  }

  /* Admin panel */
  .admin-panel {
    display: none; margin-top: 12px; padding: 14px;
    background: var(--warn-soft); border: 1px solid var(--warn-soft);
    border-radius: var(--radius-sm);
  }
  .admin-panel.open { display: block; }
  .admin-panel .field { margin-bottom: 12px; }
  .admin-panel .field:last-child { margin-bottom: 0; }
  .admin-panel label { color: var(--warn) !important; }
  .admin-submit {
    width: 100%; padding: 8px;
    font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: #fff; background: var(--warn); border: 0;
    border-radius: var(--radius-sm); cursor: pointer; margin-top: 10px;
    transition: background var(--t);
  }
  .admin-submit:hover { background: oklch(from var(--warn) calc(l - .05) c h); }

  /* Footer */
  .card-footer {
    padding: 14px 26px; background: var(--paper-2);
    border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    color: var(--ink-4); text-align: center;
  }

  /* Spinner */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .card { width: 100%; }
    .form-body { padding: 20px 18px 16px; }
    .card-footer { padding: 12px 18px; }
  }
</style>
</head>
<body>

<div class="brand-header">
  <div class="mark" aria-hidden="true">R</div>
  <div class="title">The AI Researcher</div>
  <div class="kicker">Aitheia LLC</div>
</div>

<div class="card">

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-login"    onclick="switchTab('login')">Sign In</div>
    <div class="tab"        id="tab-register" onclick="switchTab('register')">Register</div>
  </div>

  <!-- ── LOGIN PANEL ── -->
  <div id="panel-login" class="form-body">
    <div class="banner" id="login-banner"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@institution.edu" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') submitLogin()">
      <a class="forgot-link" onclick="toggleForgotPanel()">Forgot password?</a>
    </div>

    <div class="forgot-panel" id="forgot-panel">
      <div class="field">
        <label>Enter your registered email</label>
        <input type="email" id="forgot-email" placeholder="you@institution.edu"
               onkeydown="if(event.key==='Enter') submitForgot()">
      </div>
      <div class="banner" id="forgot-banner"></div>
      <button class="forgot-submit" onclick="submitForgot()">Send Reset Link</button>
    </div>

    <button class="submit-btn" id="login-btn" onclick="submitLogin()">Sign In</button>

    <div class="divider">or</div>

    <button class="admin-btn" onclick="toggleAdminPanel()">
      Admin access
    </button>

    <div class="admin-panel" id="admin-panel">
      <div class="field">
        <label>Admin secret key</label>
        <input type="password" id="admin-secret" placeholder="Secret key"
               onkeydown="if(event.key==='Enter') submitAdmin()">
      </div>
      <div class="banner" id="admin-banner"></div>
      <button class="admin-submit" onclick="submitAdmin()">Enter as Admin</button>
    </div>
  </div>

  <!-- ── REGISTER PANEL ── -->
  <div id="panel-register" class="form-body" style="display:none">
    <div class="banner" id="register-banner"></div>

    <div class="field">
      <label>Display Name</label>
      <input type="text" id="reg-name" placeholder="e.g. Tom" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@institution.edu" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password">
      <div class="field-hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="reg-confirm" placeholder="••••••••" autocomplete="new-password"
             onkeydown="if(event.key==='Enter') submitRegister()">
    </div>

    <button class="submit-btn" id="register-btn" onclick="submitRegister()">Create Account</button>
  </div>

  <div class="card-footer">
    The AI Researcher
  </div>
</div>

<script>
// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('panel-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('panel-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  clearBanners();
}

function clearBanners() {
  ['login-banner','register-banner','admin-banner','forgot-banner'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'banner';
    el.textContent = '';
  });
}

function toggleForgotPanel() {
  const panel = document.getElementById('forgot-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('forgot-email').focus();
  }
}

async function submitForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  clearBanners();
  if (!email) {
    showBanner('forgot-banner', 'Please enter your email.');
    return;
  }
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const body = await res.json();
    if (res.ok) {
      showBanner('forgot-banner', body.message || 'If that email is registered, a reset link has been sent.', 'success');
    } else {
      showBanner('forgot-banner', body.detail || 'Request failed.');
    }
  } catch (e) {
    showBanner('forgot-banner', 'Network error.');
  }
}

function showBanner(id, msg, type='error') {
  const el = document.getElementById(id);
  el.className = 'banner ' + type;
  el.textContent = msg;
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Please wait…';
  } else {
    btn.disabled = false;
    btn.textContent = btnId === 'login-btn' ? 'Sign In' : 'Create Account';
  }
}

// ── Admin panel toggle ────────────────────────────────────────────────────
function toggleAdminPanel() {
  const panel = document.getElementById('admin-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('admin-secret').focus();
  }
}

// ── Login ────────────────────────────────────────────────────────────────
async function submitLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  clearBanners();

  if (!email || !password) {
    showBanner('login-banner', 'Please enter your email and password.');
    return;
  }

  setLoading('login-btn', true);
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json();
    if (!res.ok) {
      showBanner('login-banner', body.detail || 'Login failed.');
    } else {
      await postAuthRedirect();
    }
  } catch (e) {
    showBanner('login-banner', 'Network error — is the server running?');
  } finally {
    setLoading('login-btn', false);
  }
}

// ── Admin secret ─────────────────────────────────────────────────────────
async function submitAdmin() {
  const secret = document.getElementById('admin-secret').value;
  clearBanners();
  if (!secret) { showBanner('admin-banner', 'Enter the admin secret key.'); return; }

  try {
    const res = await fetch('/api/auth/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret }),
    });
    const body = await res.json();
    if (!res.ok) {
      showBanner('admin-banner', body.detail || 'Invalid secret.');
    } else {
      window.location.href = '/admin';
    }
  } catch (e) {
    showBanner('admin-banner', 'Network error.');
  }
}

// ── Register ─────────────────────────────────────────────────────────────
async function submitRegister() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm  = document.getElementById('reg-confirm').value;
  clearBanners();

  if (!name || !email || !password || !confirm) {
    showBanner('register-banner', 'Please fill in all fields.');
    return;
  }
  if (password.length < 8) {
    showBanner('register-banner', 'Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showBanner('register-banner', 'Passwords do not match.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showBanner('register-banner', 'Please enter a valid email address.');
    return;
  }

  setLoading('register-btn', true);
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, display_name: name }),
    });
    const body = await res.json();
    if (!res.ok) {
      showBanner('register-banner', body.detail || 'Registration failed.');
    } else {
      showBanner('register-banner', 'Account created! Signing you in…', 'success');
      // Auto-login after register — then route via postAuthRedirect so brand-
      // new users land on /onboarding when ENTERPRISE_MODE is live.
      setTimeout(async () => {
        const lr = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (lr.ok) await postAuthRedirect();
      }, 800);
    }
  } catch (e) {
    showBanner('register-banner', 'Network error — is the server running?');
  } finally {
    setLoading('register-btn', false);
  }
}

// ── Post-auth routing ─────────────────────────────────────────────────────
// Centralized so the login, register, and "already logged in" paths all route
// consistently. Unseated users (non-admin) land on /onboarding when
// ENTERPRISE_MODE is live on the backend; otherwise everyone goes to /.
async function postAuthRedirect() {
  try {
    const r = await fetch('/api/auth/me');
    if (!r.ok) { window.location.href = '/login'; return; }
    const me = await r.json();
    if (me.needs_onboarding) {
      window.location.href = '/onboarding';
      return;
    }
    window.location.href = '/';
  } catch (_) {
    window.location.href = '/';
  }
}

// Check if already logged in — route accordingly.
(async () => {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) return;  // not logged in, stay on /login
    const me = await res.json();
    if (me.needs_onboarding) { window.location.href = '/onboarding'; return; }
    window.location.href = '/';
  } catch (_) {}
})();
</script>
</body>
</html>
