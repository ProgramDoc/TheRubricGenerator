<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Researcher — Reset Password</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --navy: #161b2e; --blue: #274472; --sky: #5e9ad0;
  --green: #16a34a; --red: #dc2626;
  --bg: #f4f5f9; --card: #ffffff; --border: #dce4ee;
  --text: #1e293b; --muted: #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: 'IBM Plex Sans', sans-serif;
  background: var(--navy); color: var(--text); font-size: 14px;
}
body {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; min-height: 100vh;
  background: radial-gradient(ellipse at 60% 20%, #1e2d4a 0%, #161b2e 60%);
}

.brand {
  font-size: 22px; font-weight: 700; color: #fff;
  letter-spacing: -.3px; margin-bottom: 28px; text-align: center;
}
.brand span { color: var(--sky); }
.brand sub {
  display: block; font-size: 11px; font-weight: 400;
  color: rgba(255,255,255,.35); letter-spacing: .08em;
  text-transform: uppercase; margin-top: 4px; font-family: 'IBM Plex Mono', monospace;
}

.card {
  background: var(--card); border-radius: 12px;
  width: 380px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
  overflow: hidden;
}
.card-header {
  padding: 18px 28px; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600; color: var(--blue);
}
.form-body { padding: 28px; }
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--blue); letter-spacing: .05em; text-transform: uppercase;
  margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 13px;
  color: var(--text); background: #f8fafc; outline: none;
}
.field input:focus { border-color: var(--sky); background: #fff; }
.field-hint { font-size: 10.5px; color: var(--muted); margin-top: 4px; }

.banner {
  padding: 10px 12px; border-radius: 6px; font-size: 12px;
  margin-bottom: 16px; display: none; line-height: 1.4;
}
.banner.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
.banner.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }

.submit-btn {
  width: 100%; padding: 10px; border: none; border-radius: 6px;
  background: var(--sky); color: #fff; font-family: inherit;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.submit-btn:hover:not(:disabled) { background: #4a8ac0; }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

.card-footer {
  padding: 14px 28px; background: #f8fafc;
  border-top: 1px solid var(--border); font-size: 11px;
  color: var(--muted); text-align: center;
}
.card-footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
.card-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="brand">
  The AI <span>Researcher</span>
  <sub>Password Reset</sub>
</div>

<div class="card">
  <div class="card-header">Set a new password</div>
  <div class="form-body">
    <div class="banner" id="banner"></div>

    <div class="field">
      <label>New Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
      <div class="field-hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password"
             onkeydown="if(event.key==='Enter') submitReset()">
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitReset()">Reset Password</button>
  </div>
  <div class="card-footer">
    <a href="/login">Back to sign in</a>
  </div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');

function showBanner(msg, type='error') {
  const el = document.getElementById('banner');
  el.className = 'banner ' + type;
  el.textContent = msg;
}

if (!token) {
  showBanner('Missing reset token. Please use the link from your email.');
  document.getElementById('submit-btn').disabled = true;
}

async function submitReset() {
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;

  if (!password || !confirm) {
    showBanner('Please fill in both password fields.');
    return;
  }
  if (password.length < 8) {
    showBanner('Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showBanner('Passwords do not match.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Resetting…';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: password }),
    });
    const body = await res.json();
    if (res.ok) {
      showBanner('Password reset successful! Redirecting to sign in…', 'success');
      setTimeout(() => { window.location.href = '/login'; }, 1500);
    } else {
      showBanner(body.detail || 'Reset failed.');
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  } catch (e) {
    showBanner('Network error.');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
