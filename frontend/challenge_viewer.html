<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGAI · Rubric Generator — Challenge Detail</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --navy: #161b2e; --blue: #274472; --sky: #5e9ad0;
  --green: #16a34a; --red: #dc2626; --amber: #d97706; --purple: #7c3aed;
  --bg: #f4f5f9; --card: #ffffff; --border: #dce4ee;
  --text: #1e293b; --muted: #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }

.topbar { background: var(--navy); color: #fff; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.topbar .brand { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
.topbar .brand span { color: var(--sky); }
.topbar nav { display: flex; gap: 4px; align-items: center; }
.topbar nav a { font-family: inherit; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 5px; text-decoration: none; }
.topbar nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.topbar nav a.active { background: rgba(255,255,255,.15); color: #fff; }
.topbar .user-badge { margin-left: 14px; padding: 4px 10px; background: rgba(255,255,255,.1); border-radius: 4px; font-size: 11px; color: rgba(255,255,255,.85); }
.topbar .signout-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 6px 12px; border-radius: 5px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; margin-left: 10px; }

.container { max-width: 1200px; margin: 0 auto; padding: 28px; }
.back-link { font-size: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
.back-link:hover { color: var(--blue); }
.page-title { font-size: 22px; font-weight: 700; color: var(--navy); margin-top: 6px; margin-bottom: 4px; letter-spacing: -.3px; }
.page-subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

.meta-row { display: flex; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.meta-item { font-size: 11px; color: var(--muted); }
.meta-item strong { color: var(--navy); font-size: 13px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; display: block; margin-top: 2px; }

.status { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.status-complete { background: #dcfce7; color: #15803d; }
.status-running { background: #fef3c7; color: #a16207; }
.status-pending { background: #e2e8f0; color: #475569; }
.status-failed { background: #fee2e2; color: #b91c1c; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.card-header h2 { font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: .02em; }
.card-body { padding: 20px; }

table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 11px 16px; background: #f8fafc; border-bottom: 1px solid var(--border); }
tbody td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 12px; color: var(--text); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
.num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--navy); text-align: right; }

.model-badge { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; letter-spacing: .05em; }
.badge-openai { background: rgba(16,163,127,.15); color: #047857; }
.badge-anthropic { background: rgba(124,58,237,.15); color: var(--purple); }
.badge-google { background: rgba(66,133,244,.15); color: #1a56db; }

.question-block { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.question-header { padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.question-header:hover { background: #eff6ff; }
.q-title { font-size: 12px; font-weight: 700; color: var(--navy); }
.q-domain { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-left: 8px; }
.q-maxpts { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--blue); }
.question-body { padding: 14px; display: none; }
.question-body.open { display: block; }

.q-section { margin-bottom: 12px; }
.q-section-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.q-text { font-size: 12.5px; color: var(--text); line-height: 1.5; }
.q-ideal { font-size: 12px; color: var(--text); line-height: 1.5; background: #f0fdf4; padding: 8px 10px; border-left: 3px solid var(--green); border-radius: 3px; }
.q-criteria { font-size: 11.5px; color: var(--muted); line-height: 1.4; font-style: italic; }

.answers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.answer-card { border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; background: #fcfcfd; }
.answer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.answer-model { font-size: 11px; font-weight: 700; color: var(--navy); font-family: 'IBM Plex Mono', monospace; }
.answer-score { font-size: 11px; font-weight: 700; color: var(--blue); font-family: 'IBM Plex Mono', monospace; }
.answer-score.perfect { color: var(--green); }
.answer-score.zero { color: var(--red); }
.answer-text { font-size: 11.5px; color: var(--text); line-height: 1.4; white-space: pre-wrap; }
.answer-reasoning { font-size: 10.5px; color: var(--muted); line-height: 1.4; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); font-style: italic; }

.empty { padding: 40px; text-align: center; color: var(--muted); font-size: 12px; }
.refresh-btn { background: var(--sky); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
.refresh-btn:hover { background: #4a8ac0; }

.error-box { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 6px; font-size: 12px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">OGAI · <span>Rubric</span> Generator</div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/challenges" class="active">Challenges</a>
    <a href="/public-tests">Public Tests</a>
    <a href="/models">Models</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/billing">Billing</a>
    <a href="/papers">Papers</a>
    <a href="/api/sso/annotator">Annotator</a>
    <a href="/admin" id="nav-admin" style="display:none">Admin</a>
    <span class="user-badge" id="user-badge">—</span>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </nav>
</div>

<div class="container">
  <a class="back-link" href="/challenges">← Back to Challenges</a>
  <div class="page-title" id="challenge-title">Loading…</div>
  <div class="page-subtitle" id="challenge-theme"></div>

  <div id="error-box" class="error-box" style="display:none"></div>

  <div class="meta-row" id="meta-row"></div>

  <!-- SCORES TABLE -->
  <div class="card" id="scores-card" style="display:none">
    <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
      <h2>Model Results</h2>
      <button class="refresh-btn" onclick="loadChallenge()">⟳ Refresh</button>
    </div>
    <div id="scores-body"></div>
  </div>

  <!-- RUBRIC + ANSWERS -->
  <div class="card" id="rubric-card" style="display:none">
    <div class="card-header"><h2>Rubric & Responses</h2></div>
    <div class="card-body" id="rubric-body"></div>
  </div>

  <!-- PAPERS -->
  <div class="card" id="papers-card" style="display:none">
    <div class="card-header"><h2>Papers in Challenge</h2></div>
    <div class="card-body" id="papers-body"></div>
  </div>
</div>

<script>
const challengeId = parseInt(location.pathname.split('/').pop(), 10);
let pollTimer = null;

async function signOut() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso.replace(' ', 'T') + 'Z');
    return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  } catch (_) { return iso; }
}

function fmtNum(n, d = 3) {
  if (n === null || n === undefined) return '—';
  return Number(n).toFixed(d);
}

function providerBadge(provider) {
  const p = (provider || '').toLowerCase();
  if (p === 'openai') return '<span class="model-badge badge-openai">OpenAI</span>';
  if (p === 'anthropic') return '<span class="model-badge badge-anthropic">Claude</span>';
  if (p === 'google') return '<span class="model-badge badge-google">Gemini</span>';
  return `<span class="model-badge">${escapeHtml(provider || '?')}</span>`;
}

async function loadMe() {
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/login'; return; }
  const me = await res.json();
  document.getElementById('user-badge').textContent = me.role || 'reviewer';
  if (me.role === 'admin') document.getElementById('nav-admin').style.display = '';
}

async function loadChallenge() {
  const res = await fetch(`/api/challenges/${challengeId}`);
  if (res.status === 404) {
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = 'Challenge not found.';
    return;
  }
  if (!res.ok) return;
  const c = await res.json();

  document.getElementById('challenge-title').textContent = c.title || `Challenge #${c.id}`;
  document.getElementById('challenge-theme').textContent = c.theme || '';

  // Meta
  const levelLabels = { easy_breezy: 'Easy Breezy', minor_league: 'Minor League', professional: 'Professional', jedi: 'Jedi' };
  const visibilityBadge = c.visibility === 'public'
    ? '<span style="background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Public</span>'
    : '<span style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Private</span>';
  const difficultyBadge = c.difficulty
    ? `<span style="background:#fef3c7;color:#a16207;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">${levelLabels[c.difficulty] || c.difficulty}</span>`
    : '—';
  const modelInfo = c.registered_model
    ? `<strong style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(c.registered_model.name)}</strong><div style="font-size:10px;color:var(--muted);">${escapeHtml(c.registered_model.version)}</div>`
    : '—';
  const projectInfo = c.project ? `<strong>${escapeHtml(c.project.name)}</strong>` : '<strong>—</strong>';
  document.getElementById('meta-row').innerHTML = `
    <div class="meta-item">Status<strong><span class="status status-${c.status}">${c.status}</span></strong></div>
    <div class="meta-item">Visibility<strong>${visibilityBadge}</strong></div>
    <div class="meta-item">Difficulty<strong>${difficultyBadge}</strong></div>
    <div class="meta-item">Project${projectInfo}</div>
    <div class="meta-item">Model Under Test<div>${modelInfo}</div></div>
    <div class="meta-item">Created<strong>${fmtDate(c.created_at)}</strong></div>
    <div class="meta-item">Completed<strong>${fmtDate(c.completed_at)}</strong></div>
    <div class="meta-item">Generator Score<strong>${fmtNum(c.generator_score)}</strong></div>
    <div class="meta-item">Judge Score<strong>${fmtNum(c.judge_score)}</strong></div>
    <div class="meta-item">Rubric Gen Time<strong>${c.generation_time_ms ? (c.generation_time_ms / 1000).toFixed(1) + 's' : '—'}</strong></div>
  `;

  if (c.error_message) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML = '<strong>Error:</strong> ' + escapeHtml(c.error_message);
  }

  // Scores table
  document.getElementById('scores-card').style.display = '';
  const participants = c.participants || [];
  if (participants.length === 0) {
    document.getElementById('scores-body').innerHTML = '<div class="empty">No participants.</div>';
  } else {
    const rows = participants.map((p, i) => `
      <tr>
        <td><strong>#${i + 1}</strong></td>
        <td><strong style="font-family:'IBM Plex Mono',monospace">${escapeHtml(p.model_id)}</strong> ${providerBadge(p.provider)}</td>
        <td><span class="status status-${p.status === 'graded' ? 'complete' : p.status === 'failed' ? 'failed' : 'running'}">${p.status}</span></td>
        <td class="num">${fmtNum(p.accuracy, 3)}</td>
        <td class="num">${fmtNum(p.speed_bonus, 3)}</td>
        <td class="num">${fmtNum(p.total_score, 3)}</td>
        <td class="num">${p.answer_time_ms ? (p.answer_time_ms / 1000).toFixed(1) + 's' : '—'}</td>
        <td class="num">${p.judge_time_ms ? (p.judge_time_ms / 1000).toFixed(1) + 's' : '—'}</td>
      </tr>
    `).join('');
    document.getElementById('scores-body').innerHTML = `
      <table>
        <thead><tr><th>Rank</th><th>Model</th><th>Status</th><th style="text-align:right">Accuracy</th><th style="text-align:right">Speed</th><th style="text-align:right">Total</th><th style="text-align:right">Answer</th><th style="text-align:right">Judge</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // Rubric + answers
  if (c.rubric && c.rubric.questions) {
    document.getElementById('rubric-card').style.display = '';
    const questions = c.rubric.questions;
    const html = questions.map((q, i) => {
      const answers = participants.map(p => {
        const ans = (p.answer_data?.responses || []).find(r => r.question_id === q.id);
        const grade = (p.grade_data?.grades || []).find(g => g.question_id === q.id);
        const scoreClass = grade && grade.score === grade.max_points ? 'perfect' : (grade && grade.score === 0 ? 'zero' : '');
        return `
          <div class="answer-card">
            <div class="answer-header">
              <div class="answer-model">${escapeHtml(p.model_id)}</div>
              <div class="answer-score ${scoreClass}">${grade ? grade.score : '—'}/${q.max_points || 1}</div>
            </div>
            <div class="answer-text">${escapeHtml(ans ? ans.answer : '(no answer)')}</div>
            ${grade && grade.reasoning ? `<div class="answer-reasoning">${escapeHtml(grade.reasoning)}</div>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="question-block">
          <div class="question-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <div>
              <span class="q-title">${escapeHtml(q.id)}. ${escapeHtml(q.question.slice(0, 80))}${q.question.length > 80 ? '…' : ''}</span>
              <span class="q-domain">${escapeHtml(q.domain || '')}</span>
            </div>
            <span class="q-maxpts">${q.max_points || 1} pts</span>
          </div>
          <div class="question-body ${i === 0 ? 'open' : ''}">
            <div class="q-section">
              <div class="q-section-label">Question</div>
              <div class="q-text">${escapeHtml(q.question)}</div>
            </div>
            <div class="q-section">
              <div class="q-section-label">Ideal Answer</div>
              <div class="q-ideal">${escapeHtml(q.ideal_answer || '')}</div>
            </div>
            <div class="q-section">
              <div class="q-section-label">Scoring Criteria</div>
              <div class="q-criteria">${escapeHtml(q.scoring_criteria || '')}</div>
            </div>
            <div class="q-section-label">Model Responses</div>
            <div class="answers-grid">${answers}</div>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('rubric-body').innerHTML = html;
  }

  // Papers
  if (c.papers && c.papers.length > 0) {
    document.getElementById('papers-card').style.display = '';
    document.getElementById('papers-body').innerHTML = c.papers.map(p =>
      `<div style="padding:6px 0;"><a href="/api/papers/${p.id}/pdf" target="_blank" style="color:var(--blue);text-decoration:none;font-weight:500;">📄 ${escapeHtml(p.filename)}</a></div>`
    ).join('');
  }

  // Auto-refresh if running
  if (c.status === 'running' || c.status === 'pending') {
    if (!pollTimer) {
      pollTimer = setInterval(loadChallenge, 5000);
    }
  } else {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }
}

loadMe();
loadChallenge();
</script>
</body>
</html>
